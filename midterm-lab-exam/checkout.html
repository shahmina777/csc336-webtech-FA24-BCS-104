<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curology Clone - Secure Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom px-4">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand fw-bold fs-3 text-dark">Curology</a>
            <a href="index.html" class="btn btn-outline-dark rounded-pill btn-sm">Back to Shop</a>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 900px;">
        <h1 class="fw-bold mb-4 text-dark fs-3">Secure Checkout</h1>
        
        <form action="#" method="POST" novalidate>
            <div class="checkout-grid">
                
             
                <fieldset class="border p-4 rounded-4 bg-light">
                    <legend class="float-none w-auto px-3 fw-bold fs-5 text-dark">Contact</legend>
                    
                    <div class="form-group-grid">
                        <label for="fullName" class="fw-medium small">Full Name</label>
                        <div>
                            <input type="text" id="fullName" name="fullName" class="form-control" required>
                            <div class="invalid-feedback">Please enter your full name.</div>
                        </div>
                    </div>

                    <div class="form-group-grid">
                        <label for="email" class="fw-medium small">Email</label>
                        <div>
                            <input type="email" id="email" name="email" class="form-control" required>
                            <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>
                    </div>

                    <div class="form-group-grid">
                        <label for="phone" class="fw-medium small">Phone</label>
                        <div>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="03XX-XXXXXXX" pattern="03\d{2}-\d{7}" required>
                            <div class="invalid-feedback">Format must be exactly 03XX-XXXXXXX.</div>
                        </div>
                    </div>
                </fieldset>

             
                <fieldset class="border p-4 rounded-4 bg-light">
                    <legend class="float-none w-auto px-3 fw-bold fs-5 text-dark">Delivery</legend>
                    
                    <div class="form-group-grid">
                        <label for="address" class="fw-medium small">Address</label>
                        <div>
                            <input type="text" id="address" name="address" class="form-control" required>
                            <div class="invalid-feedback">Please provide a delivery address.</div>
                        </div>
                    </div>

                    <div class="form-group-grid">
                        <label for="city" class="fw-medium small">City</label>
                        <div>
                            <select id="city" name="city" class="form-select" required>
                                <option value="" selected disabled>Choose city...</option>
                                <option value="Lahore">Lahore</option>
                                <option value="Karachi">Karachi</option>
                                <option value="Islamabad">Islamabad</option>
                                <option value="Faisalabad">Faisalabad</option>
                            </select>
                            <div class="invalid-feedback">Please select a delivery city.</div>
                        </div>
                    </div>

                    <div class="form-group-grid">
                        <label for="deliveryDate" class="fw-medium small">Delivery Date</label>
                        <div>
                           
                            <input type="date" id="deliveryDate" name="deliveryDate" min="2026-10-29" max="2026-11-02" class="form-control" required>
                            <div class="invalid-feedback">Select a valid date between Oct 29 and Nov 02, 2026.</div>
                        </div>
                    </div>
                </fieldset>

            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 fw-bold">Place Order</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
