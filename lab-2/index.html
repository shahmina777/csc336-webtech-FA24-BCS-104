<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 — Simplified Responsive Layout</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- 1. RESPONSIVE NAVBAR -->
    <nav class="navbar navbar-expand-md navbar-light bg-light">
        <div class="container">
            <!-- Logo (Left) -->
            <a class="navbar-brand" href="#">ShopWave</a>

            <!-- Hamburger Button (Shows below 768px) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu Items -->
            <div class="collapse navbar-collapse" id="navMenu">
                <!-- Links (Center) -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>

                <!-- Cart (Right) -->
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Cart (0)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. RESPONSIVE PRODUCT GRID -->
    <main class="container my-5">
        <h2 class="text-center mb-4">Products</h2>

        <!-- 
          - col-12: 1 column on phones
          - col-md-6: 2 columns on tablets (768px and up)
          - col-lg-3: 4 columns on desktops (992px and up)
        -->
        <div class="row g-3">
            
            <!-- Card 1 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card p-3 text-center">
                    <div class="bg-light py-5 mb-3">Image 1</div>
                    <h5>Product 1</h5>
                    <p class="text-muted">$19.99</p>
                    <button class="btn btn-primary btn-sm">Buy</button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card p-3 text-center">
                    <div class="bg-light py-5 mb-3">Image 2</div>
                    <h5>Product 2</h5>
                    <p class="text-muted">$29.99</p>
                    <button class="btn btn-primary btn-sm">Buy</button>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card p-3 text-center">
                    <div class="bg-light py-5 mb-3">Image 3</div>
                    <h5>Product 3</h5>
                    <p class="text-muted">$39.99</p>
                    <button class="btn btn-primary btn-sm">Buy</button>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card p-3 text-center">
                    <div class="bg-light py-5 mb-3">Image 4</div>
                    <h5>Product 4</h5>
                    <p class="text-muted">$49.99</p>
                    <button class="btn btn-primary btn-sm">Buy</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Bootstrap JS (Needed for the hamburger menu to open/close) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
